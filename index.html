    <script>
        // Dynamic sun rays based on time of day
        function updateSunRays() {
            const now = new Date();
            const hour = now.getHours();
            const sunRays = document.getElementById('sunRays');
            const body = document.body;
            
            // Remove existing time classes
            sunRays.className = 'sun-rays';
            body.classList.remove('day', 'night');
            
            if (hour >= 6 && hour < 10) {
                // Morning (6-10 AM)
                sunRays.classList.add('morning');
                body.classList.add('day');
            } else if (hour >= 10 && hour < 14) {
                // Noon (10 AM - 2 PM)
                sunRays.classList.add('noon');
                body.classList.add('day');
            } else if (hour >= 14 && hour < 18) {
                // Afternoon (2-6 PM)
                sunRays.classList.add('afternoon');
                body.classList.add('day');
            } else if (hour >= 18 && hour < 20) {
                // Evening/Sunset (6-8 PM)
                sunRays.classList.add('evening');
                body.classList.add('day');
            } else {
                // Night (8 PM - 6 AM)
                sunRays.classList.add('night');
                body.classList.add('night');
            }
        }

        // Parallax mouse movement
        function initParallax() {
            const stars = document.querySelector('body::before');
            const particles = document.querySelector('body::after');
            
            document.addEventListener('mousemove', (e) => {
                const x = (e.clientX - window.innerWidth / 2) / window.innerWidth;
                const y = (e.clientY - window.innerHeight / 2) / window.innerHeight;
                
                // Apply different parallax speeds to different layers
                document.documentElement.style.setProperty('--mouse-x', x);
                document.documentElement.style.setProperty('--mouse-y', y);
                
                // Apply transforms to pseudo-elements via CSS custom properties
                document.body.style.setProperty('--parallax-stars', `translate(${x * 10}px, ${y * 5}px)`);
                document.body.style.setProperty('--parallax-particles', `translate(${x * -15}px, ${y * -8}px)`);
            });
        }

        // Meteor shower effects
        function createMeteor() {
            const meteor = document.createElement('div');
            meteor.className = 'meteor';
            meteor.style.width = Math.random() * 200 + 100 + 'px';
            meteor.style.height = '2px';
            meteor.style.left = Math.random() * window.innerWidth + 'px';
            meteor.style.top = Math.random() * (window.innerHeight / 2) + 'px';
            
            document.body.appendChild(meteor);
            
            // Trigger animation
            setTimeout(() => meteor.classList.add('active'), 50);
            
            // Remove meteor after animation
            setTimeout(() => {
                if (meteor.parentNode) {
                    meteor.parentNode.removeChild(meteor);
                }
            }, 2500);
        }

        function initMeteorShower() {
            // Create meteors at random intervals
            setInterval(() => {
                if (Math.random() < 0.3) { // 30% chance every 3 seconds
                    createMeteor();
                }
            }, 3000);
            
            // Occasional meteor bursts
            setInterval(() => {
                if (Math.random() < 0.1) { // 10% chance every 10 seconds
                    for (let i = 0; i < Math.floor(Math.random() * 3) + 2; i++) {
                        setTimeout(() => createMeteor(), i * 200);
                    }
                }
            }, 10000);
        }

        // Space ambient sounds
        function initSpaceSounds() {
            // Create audio context for space ambience
            let audioContext;
            let isPlaying = false;
            
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Generate subtle space ambience
                function createSpaceAmbience() {
                    if (!isPlaying) return;
                    
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    // Very low frequency for deep space feel
                    oscillator.frequency.setValueAtTime(Math.random() * 50 + 30, audioContext.currentTime);
                    oscillator.type = 'sine';
                    
                    // Very quiet
                    gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.005, audioContext.currentTime + 2);
                    gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + 8);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 8);
                    
                    // Schedule next ambience sound
                    setTimeout(createSpaceAmbience, Math.random() * 15000 + 10000);
                }
                
                // Transit whoosh sound
                window.playTransitSound = function() {
                    if (!audioContext) return;
                    
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.5);
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.02, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.5);
                };
                
                // Start ambient sounds on first user interaction
                document.addEventListener('click', () => {
                    if (audioContext.state === 'suspended') {
                        audioContext.resume();
                    }
                    if (!isPlaying) {
                        isPlaying = true;
                        createSpaceAmbience();
                    }
                }, { once: true });
                
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        // Add parallax to background elements
        function updateParallaxCSS() {
            const style = document.createElement('style');
            style.textContent = `
                body::before {
                    transform: var(--parallax-stars, translate(0, 0)) translateY(var(--stars-y, 0px));
                }
                body::after {
                    transform: var(--parallax-particles, translate(0, 0)) translateX(var(--particles-x, 0px)) translateY(var(--particles-y, 0px));
                }
            `;
            document.head.appendChild(style);
        }
        
        // Initialize all features
        function init() {
            updateSunRays();
            setInterval(updateSunRays, 30 * 60 * 1000);
            
            initParallax();
            updateParallaxCSS();
            initMeteorShower();
            initSpaceSounds();
        }
        
        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>

</body>
